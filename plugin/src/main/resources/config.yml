# The Multiverse world used for the "Middle Earth" planet (first slot of the menu).
# World names cannot contain spaces, so use an underscore (e.g. Middle_earth).
middle-earth-world: Middle_earth

# Custom menu icons (blocks) per world. Key = world name (folder name), value = Bukkit
# material name. Can also be changed in-game with "/planets icon <planet> <material>".
# Example:
#   icons:
#     Middle_earth: AMETHYST_BLOCK
#     Mars: RED_SAND
icons: {}

# How players land on each world:
#   random  - a random safe spot inside the world border (default)
#   station - the world spawn (e.g. a space station built around spawn)
#   point   - a fixed spot, set with "/planets setlanding <planet>"
# Set with "/planets landing <planet> station|random|point".
landing-modes:
  # Space_station: station

# Fixed landing points used by "point" mode, set in-game with
# "/planets setlanding <planet>" while standing at the arrival spot.
landing-spots:
  # Space_station:
  #   x: 0
  #   y: 100
  #   z: 0
  #   yaw: 0.0
  #   pitch: 0.0

# (Legacy) Worlds whose players always land at the world spawn instead of a random
# safe spot. Superseded by "landing-modes"; kept for compatibility with old configs.
station-worlds:
  # Space_station: true

# Worlds that require the "planets.tp.<world>" permission to visit. Locked planets
# gray out in the menu for players without the permission. Toggle in-game with
# "/planets lock <planet>".
locked-worlds:
  # The_secret_base
  # Mars

# How long (in seconds) "/planets lock <planet>" waits before the planet actually
# locks. Players currently on it get a chat warning and a per-second action-bar
# countdown, so they can leave before being evicted. Set to 0 to lock instantly.
# During the countdown, "/planets lock cancel <planet>" (or a plain
# "/planets lock <planet>" again) aborts the pending lock.
lock-warning-seconds: 10

# When true, ALL Nether/End portals are disabled server-wide: walking into a
# portal frame does nothing (for players and mobs), so the Nether/End planets
# are only reachable through /planets. Toggle in-game with "/planets portals on|off".
disable-portals: false

# Per-world potion effects applied to players while they are in the world and
# re-applied periodically (removed on leaving). These simulate planet physics:
# jump height, walk speed, melee strength, swim speed, breathing, ...
# Effect = amplifier (0 = base level). Friendly names: jump, speed, strength,
# swim, breath, fall — or any real effect name (night_vision, haste, saturation,
# resistance, regeneration, fire_resistance, ...).
# Set with "/planets world <planet> effect <effect> <amplifier|off>".
effects:
  # Moon:
  #   jump: 2      # higher jumps
  #   fall: 1      # slow falling (floaty)
  #   speed: 1     # faster walking
  #   strength: 1  # stronger melee hits
  # Ocean:
  #   swim: 1      # faster swimming (dolphins grace)
  #   breath: 1    # no drowning (water breathing)

# (Legacy) Worlds with simulated low gravity. Superseded by "effects"; kept for
# compatibility with old configs. "/planets world <planet> gravity on|off" now
# writes jump + fall entries under "effects" above.
gravity-worlds:
  # Moon

# Space-station rescue mode: which damage causes a station world ({@code landing-modes.
# <name>: station} or the legacy {@code station-worlds.<name>: true}) blocks.
# Values per world, falling back to {@code default} (and then to {@code all-lethal}).
#   void-only       - only falling out of the world and the void are blocked.
#                     Players still take lethal damage from mobs, fall-damage-on-impact,
#                     and other players (PvP still works).
#   void-fall-pvp   - void/fall and player-vs-player lethal damage are blocked (PvP
#                     is off on the station), but mobs and environmental damage still
#                     kill the player.
#   all-lethal      - every hit that would kill the player is blocked and they are
#                     pulled back to the station's landing spot (or spawn) instead
#                     (this is the default, and what the plugin did before this option).
station-rescue-mode:
  default: all-lethal
  # Space_station: void-fall-pvp

# Worlds with a hostile atmosphere: players take damage every second unless they
# wear a helmet. If "helmets" is empty, any helmet protects; otherwise only the
# listed materials do. Creative/spectator players and holders of
# "planets.atmosphere.bypass" are immune.
# Set with "/planets world <planet> atmosphere <damage|off> [helmet material...]".
atmospheres:
  # Venus:
  #   damage: 2             # health points per second (2 = one heart)
  #   helmets: [NETHERITE_HELMET]

# Worlds whose Nether/End dimension linking is disabled: portals are blocked and
# the linked <world>_nether / <world>_the_end worlds are hidden from /planets,
# so those dimensions are only reachable as standalone planets created with
# "/planets create <name> nether|the_end".
# Set with "/planets world <planet> dimensions on|off".
disabled-dimensions:
  # Middle_earth

# Worlds with locked weather: the chosen condition is re-applied continuously
# so the weather cycle can't drift it away. Values: clear, rain, thunder.
# Set with "/planets world <planet> weather clear|rain|thunder|off".
weather-lock:
  # Mars: clear
  # Venus: rain
  # Jupiter: thunder

# Per-planet visual atmosphere. The "sky" color drives a floating colored haze
# (low-density dust particles drifting around players), so every planet looks
# different — e.g. an orange Martian dust haze. This works on every Paper version
# with no extra plugins. Additionally, when ProtocolLib is installed, the real
# dimension-type registry is rewritten so the actual sky and fog are tinted
# (this is a 26.x-era feature: the client renders sky/fog colors from the
# dimension type, so all normal planets share one tint per player while
# connected, and the tint updates when they hop planets via a configuration
# re-run). "water" is stored for the status overview only — water color is
# biome-driven in these versions and can't be tinted via the dimension type.
# Colors are hex like "#FF8800" or names like "orange". "density" is the number
# of colored particles per second per player (0 disables the haze).
# Set with "/planets world <planet> sky <color> [fogColor] [waterColor]"
# and removed with "/planets world <planet> sky off".
sky-colors:
  # Mars:
  #   sky: "#FF8844"
  #   fog: "#AA5522"
  #   water: "#FFAA66"
  #   density: 8

# When true (and ProtocolLib is installed), the sky/fog tint is refreshed live
# every time a player changes planets by re-running the configuration phase
# (the client re-downloads the dimension registry). Set to false to only tint on
# login; the particle haze is unaffected by this toggle.
sky-live-refresh: true

# Per-planet ambient particle effects, layered on top of the sky haze. "density"
# is the number of particles per second around each player (0 disables).
# Effects: embers (rising sparks), sparks (electric), snow, rain (colored rain,
# tinted with the planet's sky color), ash, bubbles (for underwater planets),
# fireflies, magic, smoke, glow, sculk, lava.
# Set with "/planets world <planet> particles <effect|off> [density]".
particles:
  # Venus:
  #   effect: embers
  #   density: 10
  # Frost:
  #   effect: snow
  #   density: 6

# ── Planet soundtrack ────────────────────────────────────────────────────────
# Calm vanilla music while a player stands on a planet or in a lobby. Every
# player can switch it off for themselves with the "Planet Music" toggle in
# /settings (it is on by default); nothing ever plays in a world this plugin
# does not own.
#
# A track is a Sound name ("MUSIC_END"), a sound with roughly how many seconds
# it lasts ("MUSIC_END:170"), or a small map:
#   - sound: MUSIC_OVERWORLD_FOREST
#     seconds: 280
# The length only decides when the next track may start, so an approximation is
# fine. Sound names may also be written as music.end or music_end.
music:
  # Turn the whole soundtrack off (the players' own toggles are left alone).
  enabled: true
  # Played at this volume, 0.0 – 1.0. It uses the MUSIC channel, so a player
  # who muted "Music" in their own options still stays silent.
  volume: 0.6
  # Silence between two tracks, picked at random inside this range (seconds).
  gap-min-seconds: 60
  gap-max-seconds: 180
  # World -> its tracks. "default" covers every planet and lobby without an
  # entry of its own; an empty list silences just that world.
  # This whole section can be edited in-game: open the admin panel for a planet
  # (or a lobby) and click Music to add, hear, reorder and remove tracks.
  tracks:
    default:
      - sound: MUSIC_END
        seconds: 170
      - sound: MUSIC_OVERWORLD_DRIPSTONE_CAVES
        seconds: 260
      - sound: MUSIC_OVERWORLD_LUSH_CAVES
        seconds: 300
      - sound: MUSIC_OVERWORLD_DEEP_DARK
        seconds: 220
      - sound: MUSIC_UNDER_WATER
        seconds: 140
    # Give a single planet (or lobby) its own soundtrack:
    # Middle_earth:
    #   - "MUSIC_OVERWORLD_FOREST:280"
    #   - "MUSIC_OVERWORLD_MEADOW:210"
    #   - "MUSIC_OVERWORLD_CHERRY_GROVE:240"

# My Planet system settings.
# Players own planets and manage them from the /myp control panel
# (members, upgrades, settings...). Owned planets are hidden from the
# public /planets menu and only appear in /myp.
my-planet:
  # Maximum planets each player can own.
  max-per-player: 2
  # How many planets with a CUSTOM generation (Mars, Moon, Crystal, ...) a
  # player may own. Normal planets are never limited by this, only by
  # max-per-player. Set to 0 for no limit at all.
  max-custom-planets: 1
  # Cost in money to buy a brand-new default planet through the "Buy a Planet"
  # UI in /planets. Set in-game with "/planets buy <amount>" (VPL money).
  buy-cost: 1000
  # Maximum upgrade level for most planet upgrades.
  # Planet Size has its own ladder instead of the generic cap. A planet is bought
  # at a 5x5 block plot and grows one chunk at a time; the border side length per
  # level, and the VPL price of each level, are fixed in the plugin:
  #   bought   5x5 blocks    —
  #   level 1  1x1 chunks    2,000 VPL
  #   level 2  2x2 chunks    6,000 VPL
  #   level 3  3x3 chunks   23,000 VPL
  #   level 4  4x4 chunks   40,000 VPL
  #   level 5  5x5 chunks   65,000 VPL
  #   level 6  6x6 chunks  130,000 VPL   (special, top size)
  max-upgrade-level: 10
  # Block Limitations is also a fixed ladder (planet-wide placed blocks):
  # 20 base, then 50 / 150 / 350 / 1000 / 1600 blocks.
  # Everything else (member cap, visitor cap, TP cooldown/duration) costs
  # 100 VPL per level.
  # Rename price ladder in VPL: the 1st rename is free, the 2nd costs the
  # first entry, the 3rd the second entry, and so on. The last entry is
  # reused for every rename after that (default: 1k, 5k, 10k, 20k...).
  rename-prices: [1000, 5000, 10000, 20000]

# ── Player homes (/home, /sethome, /delhome) ─────────────────────────────────
# Everybody gets the same "max" home slots — there is no paid tier. Players
# may pick the colour of their own bed icons in /home for free.
homes:
  max: 4
  # Seconds a player waits before a home teleport lands. Moving a block or
  # taking damage during the countdown cancels it. Set to 0 for instant
  # teleports.
  teleport-delay: 3

# ── Optional Planet HUD (/settings → Planet HUD) ────────────────────────────
# The action bar that follows players around. It only appears while standing on
# a planet or in a lobby, and it stays quiet for a few seconds after a mention
# ping, a planet-lock countdown or an atmosphere warning, so those are never
# painted over. Players switch it off individually in /settings, and they cycle
# through the lines below by right-clicking that item.
#
# "modes" is the whole cycle, in order: rename them, reorder them, delete the
# ones you don't want, or add your own. The second line is the default a player
# starts on. Placeholders:
#   %planet%       the planet's name (or the world's name off-planet)
#   %world%        the raw world name
#   %balance%      the player's VPL balance
#   %x% %y% %z%    the player's block coordinates
#   %players%      players online on the server
#   %visitors%     players standing in the same world
#   %members%      members of that planet (player-owned planets only)
#   %blocks%       blocks placed on that planet
#   %block-limit%  that planet's block limit
#   %size%         that planet's size level, e.g. "2x2 chunks"
#   %next-size%    VPL price of the next size level, or "max"
# Anything else is left exactly as typed, so a typo is visible rather than
# silent.
hud:
  interval-ticks: 40
  # Which line players start on, counting from 1 (2 = the second line below).
  # The in-game editor (/planets hud) writes this when you press "Set as Default".
  default-mode: 2
  modes:
    - label: "Planet only"
      template: "🪐 %planet%"
    - label: "Planet + balance"
      template: "🪐 %planet%  ·  💰 %balance% ₾ | VPL |"
    - label: "Planet + coordinates"
      template: "🪐 %planet%  ·  📍 %x%, %y%, %z%"
    # Examples you can enable by deleting the "#":
    # - label: "Planet + visitors"
    #   template: "🪐 %planet%  ·  👥 %visitors% here"
    # - label: "Planet + build"
    #   template: "🪐 %planet%  ·  🧱 %blocks%/%block-limit% blocks"
    # - label: "Planet + next size"
    #   template: "🪐 %planet%  ·  📏 %size% → %next-size% VPL"

# The sidebar: a scoreboard pinned down the right of every player's screen.
# Each player gets their own copy, so the numbers in it are theirs. The whole
# sidebar is switched on or off per player from /settings → Sidebar, and
# right-clicking that item opens the line picker, where a player chooses which
# of the lines below they want and in what order.
sidebar:
  # Switch the sidebar off for the whole server.
  enabled: true
  # How often the numbers are read again, in ticks (20 ticks = 1 second).
  interval-ticks: 20
  # The heading drawn above the lines.
  title: "PLANETARIUM SMP"
  title-color: gold
  line-color: white
  # One entry per line, top to bottom. "label" is the name players see in the
  # picker; a line's id is worked out from its label, so renaming one resets
  # that line to the default for players who had customised their sidebar.
  # At most 14 lines are drawn (the client fits the title plus 14 rows).
  #
  # Placeholders:  %player% %balance% %neb% %playtime% %deaths% %kills%
  #                %planets% %planet% %world% %x% %y% %z% %players%
  #                %visitors% %members% %blocks% %block-limit% %size%
  #                %next-size% %friends%
  #                %cards% %cards-unique% %cards-total% %cards-copies%
  #                %cards-time%
  #
  # %friends% renders as "online/total" — e.g. "2/8" means two of your
  # friends are on right now out of eight in total.
  # %cards% renders the same way for the Entity Card Hunt — e.g. "47/82"
  # unique cards found, with %cards-copies% for the total copies and
  # %cards-time% for the time left (e.g. "13d 7h").
  lines:
    - label: "Player"
      template: "%player%"
    - label: "Balance"
      template: "%balance% ₾"
    - label: "Friends"
      template: "Friends: %friends%"
    - label: "Playtime"
      template: "⏱ %playtime%"
    - label: "Deaths"
      template: "☠ %deaths%"
    - label: "Kills"
      template: "⚔ %kills%"
    # Examples you can turn on by deleting the "#":
    # - label: "Planets"
    #   template: "🪐 %planets% planets"
    # - label: "Where"
    #   template: "📍 %planet%"
    # - label: "NEB"
    #   template: "✨ %neb% NEB"
    # - label: "Server"
    #   template: "👥 %players% online"

# Planet world border settings.
# When a planet is created, a world border is set around the spawn point.
# This value is the default border size (side length in blocks) for worlds the
# plugin creates for admins; planets bought by players use their own Planet Size
# level instead (5 blocks when bought, growing up to 96 blocks).
# Set to 0 to disable world borders.
planet-world-border-radius: 15

# ── Friends & Social ────────────────────────────────────────────────────────
# Everything behind /friend and /friends. Friendships, requests, favourites,
# the activity feed and the gift totals live in friends.yml and are written
# automatically. Which notifications a player gets is theirs to choose from
# /settings → 👥 Friends (or /friends → Settings) — never here.
#
# The sidebar can show the count as "Friends: 2/8" (2 online, 8 total) by
# adding a line with the template "Friends: %friends%" under sidebar.lines.
friends:
  # How many friends one player may have. Nobody can befriend past this.
  max-friends: 100
  # How long an unanswered request stays valid, in minutes (4320 = 3 days).
  request-expiry-minutes: 4320
  # The gap a player must leave between sending two requests, in seconds.
  request-cooldown-seconds: 3
  # How long a player can stand still before friends see them as AFK (seconds).
  # Set to 0 to switch AFK off.
  afk-seconds: 300
  # How many activity-feed entries are kept per player.
  activity-size: 30
  # How often expired requests and stale entries are cleaned up, in minutes.
  maintenance-minutes: 10
  # Gift limits, in VPL. Gifts move real balance through Vault, so a friend
  # who is offline simply finds the money when they come back.
  gifts:
    min: 1.0
    max: 100000.0

# ── Entity Card Hunt ────────────────────────────────────────────────────────
# The limited-time collectible event behind /cards (alias /c). Every mob has its
# own card, its own drop chance and its own row in every player's collection.
# Collections, the copy counts and the event's end timestamp live in cards.yml
# and are written automatically — nothing here needs to be backed up separately.
#
# Adding or removing an entity under "entities" changes the collection size
# everywhere at once (progress, GUIs and the leaderboard all read this list).
cards:
  # How many copies of one card a player may hold.
  max-copies: 64
  # How every card is drawn in the collection: spawn-egg (the default) uses
  # each mob's spawn egg, falling back to its head for mobs vanilla has no egg
  # for (the Ender Dragon). Set "mob-head" to prefer heads instead — either way
  # a mob with neither gets a plain head, never a blank slot.
  icon-style: spawn-egg
  # What a card looks like before it is found. Set reveal-undiscovered to true
  # to show every real mob head from the start.
  unknown-icon: GRAY_STAINED_GLASS_PANE
  unknown-name: "???"
  reveal-undiscovered: false
  # Whether the card menus reopen where a player left them: the collection on
  # its layout (detail or compact album), category, filter and page, and the
  # leaderboard on the page it was showing — instead of starting over.
  remember-filters: true
  # How long the event runs, in hours, when no end has been set yet
  # (336 = 14 days). 0 or less leaves the event open-ended.
  # The end timestamp is stored in cards.yml; move it live with
  #   /cardeventduration set <hours>
  event-duration-hours: 336
  # Who may use /cardeventduration (see planets.cards.admin in plugin.yml).
  admin-permission: planets.cards.admin
  # Leaderboard: how many players are drawn per page, how long a built ranking
  # is reused, and how often a leaderboard that is open on somebody's screen
  # redraws itself. Lower this to make more pages.
  leaderboard-size: 10
  leaderboard-refresh-seconds: 60
  leaderboard-live-refresh-seconds: 20

  # Bad-luck protection. The hunt is built around flat odds — a 1% card really
  # is 1% per kill — so this is OFF by default and the chances above are then
  # exactly the chances rolled. Switch it on for a gentler event: once one card
  # has failed "threshold" rolls in a row, each further failure multiplies that
  # card's chance by another "growth-percent" of its base, up to
  # "max-multiplier". Streaks are counted per card and per player, they survive
  # restarts, and a card that finally drops starts the count again.
  # "guarantee-at" is the blunt instrument: leave it at 0 and there is never a
  # guaranteed drop, or set it (say 150) to make the card certain at that many
  # consecutive failures.
  bad-luck:
    enabled: false
    threshold: 20
    growth-percent: 15
    max-multiplier: 5.0
    guarantee-at: 0

  # The random "new card!" messages. Normal is whatever is left after the two
  # chances below, and the tier only changes the wording, colour and sound —
  # never the card or the odds.
  discovery:
    rare-chance: 13
    ultra-chance: 2
    normal:
      - "Wow, looks like that's something new ..."
      - "Nice card you found right there!"
      - "Great job!"
      - "Nice find!"
      - "Cool find!"
      - "Yeeeeyyyy!"
      - "Keep up the good work!"
    rare:
      - "Ooooh... we haven't seen this one before!"
      - "The collection grows..."
      - "Someone's been hunting... 👀"
      - "Your collection just got a little more interesting."
      - "Bro is collecting Minecraft mobs 💀"
      - "Certified card collector moment."
      - "The Planetarium approves. 🌌"
    ultra-rare:
      - "WAIT... YOU ACTUALLY FOUND IT?!"
      - "The universe has chosen you."
      - "You were NOT supposed to find this one."
      - "Professional Mob Collector."

  # Menu titles and the label every secondary menu's back button carries.
  gui:
    main-title: "🃏 Entity Card Hunt"
    collection-title: "🃏 Card Collection"
    info-title: "📖 Event Info"
    leaderboard-title: "🏆 Card Leaderboard"
    back-label: "⬅ Back to Card Collection"

  # Extra lines added to the last page of the Event Info book.
  info:
    lines:
      - "Cards are permanent: the event ending never removes them."
      - "Only kills made during the event roll for a card."

  # Every collectible card. Fields:
  #   id           key stored in cards.yml (changing it resets that card)
  #   entity       a Bukkit EntityType name; unknown names are skipped
  #   name         the display name
  #   chance       percent chance per kill of that mob (15 = 15%)
  #   category     animals | monsters | bosses | special
  #   rarity       common | uncommon | rare | epic | legendary | mythic |
  #                unobtainable
  #   icon         optional material override (defaults to the mob's spawn egg,
  #                or its head when vanilla has no egg for it — see icon-style)
  #   head-texture optional base64 head texture for a custom mob head
  #   obtainable   set false to make a card impossible to earn
  #   max-copies   optional per-card cap (defaults to max-copies above)
  entities:
    # ── 🐑 Animals ────────────────────────────────────────────────────────
    - { id: allay, entity: ALLAY, name: "Allay", chance: 6, category: animals, rarity: uncommon }
    - { id: armadillo, entity: ARMADILLO, name: "Armadillo", chance: 12, category: animals, rarity: common }
    - { id: axolotl, entity: AXOLOTL, name: "Axolotl", chance: 10, category: animals, rarity: uncommon }
    - { id: bat, entity: BAT, name: "Bat", chance: 14, category: animals, rarity: common }
    - { id: bee, entity: BEE, name: "Bee", chance: 12, category: animals, rarity: common }
    - { id: camel, entity: CAMEL, name: "Camel", chance: 10, category: animals, rarity: common }
    - { id: cat, entity: CAT, name: "Cat", chance: 10, category: animals, rarity: common }
    - { id: chicken, entity: CHICKEN, name: "Chicken", chance: 16, category: animals, rarity: common }
    - { id: cod, entity: COD, name: "Cod", chance: 14, category: animals, rarity: common }
    - { id: cow, entity: COW, name: "Cow", chance: 16, category: animals, rarity: common }
    - { id: dolphin, entity: DOLPHIN, name: "Dolphin", chance: 8, category: animals, rarity: uncommon }
    - { id: donkey, entity: DONKEY, name: "Donkey", chance: 10, category: animals, rarity: common }
    - { id: fox, entity: FOX, name: "Fox", chance: 12, category: animals, rarity: common }
    - { id: frog, entity: FROG, name: "Frog", chance: 12, category: animals, rarity: common }
    - { id: glow_squid, entity: GLOW_SQUID, name: "Glow Squid", chance: 8, category: animals, rarity: uncommon }
    - { id: goat, entity: GOAT, name: "Goat", chance: 10, category: animals, rarity: common }
    - { id: horse, entity: HORSE, name: "Horse", chance: 10, category: animals, rarity: common }
    - { id: iron_golem, entity: IRON_GOLEM, name: "Iron Golem", chance: 5, category: animals, rarity: rare }
    - { id: llama, entity: LLAMA, name: "Llama", chance: 10, category: animals, rarity: common }
    - { id: mooshroom, entity: MOOSHROOM, name: "Mooshroom", chance: 6, category: animals, rarity: rare }
    - { id: mule, entity: MULE, name: "Mule", chance: 8, category: animals, rarity: uncommon }
    - { id: ocelot, entity: OCELOT, name: "Ocelot", chance: 8, category: animals, rarity: uncommon }
    - { id: panda, entity: PANDA, name: "Panda", chance: 6, category: animals, rarity: rare }
    - { id: parrot, entity: PARROT, name: "Parrot", chance: 10, category: animals, rarity: common }
    - { id: pig, entity: PIG, name: "Pig", chance: 16, category: animals, rarity: common }
    - { id: polar_bear, entity: POLAR_BEAR, name: "Polar Bear", chance: 6, category: animals, rarity: rare }
    - { id: pufferfish, entity: PUFFERFISH, name: "Pufferfish", chance: 12, category: animals, rarity: common }
    - { id: rabbit, entity: RABBIT, name: "Rabbit", chance: 14, category: animals, rarity: common }
