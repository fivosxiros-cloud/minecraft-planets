# ══════════════════════════════════════════════════════════════════════════════
#  VOLCANIC — extreme relief, a lava sea, and lava chambers under everything.
#
#  The liquid is lava, so sea level is a molten shoreline: the surface pass puts
#  basalt on any column the lava reaches and the biome rules keep the shores
#  bare. Cliffs are stepped hard so the mountains read as flows and scarps.
# ══════════════════════════════════════════════════════════════════════════════

id: volcanic
display-name: "Volcanic"
description: "Black rock, ash skies and an ocean of lava."
icon: MAGMA_BLOCK
style: mountain_world
seed: random

palette:
  stone: BASALT
  deepslate: BLACKSTONE
  dirt: BLACKSTONE
  grass: BASALT
  sand: BLACKSTONE
  gravel: GRAVEL
  lava: LAVA
  lava-shore: BASALT
  ice: PACKED_ICE
  magma: MAGMA_BLOCK
  ash: GRAY_CONCRETE
  obsidian: OBSIDIAN

terrain:
  height:
    base: 92
    min: 26
    max: 300
  # A molten sea, well below the peaks.
  sea-level: 54
  liquid: lava

  horizontal-scale: 0.9
  vertical-scale: 1.3

  layers:
    continentalness:
      type: perlin
      scale: 560
      amplitude: 26
      octaves: 3
    erosion:
      type: ridged
      scale: 300
      amplitude: 22
      octaves: 4
    weirdness:
      type: value
      scale: 220
      amplitude: 14
      octaves: 3

  mountains:
    enabled: true
    strength: 96
    scale: 300
    width: 180
    sharpness: 0.95

  valleys:
    enabled: true
    strength: 8
    scale: 260
    width: 160
    sharpness: 0.1

  canyons:
    enabled: true
    strength: 40
    scale: 200
    width: 0.6
    sharpness: 0.9

  cliffs:
    enabled: true
    strength: 18
    width: 9
    scale: 140
    sharpness: 0.85

  plateaus:
    enabled: true
    strength: 34
    scale: 360
    width: 70
    sharpness: 0.4

  detail-strength: 6
  detail-frequency: 0.035
  distortion-strength: 22
  distortion-frequency: 0.002

  islands:
    enabled: false

surface:
  layers:
    - { block: SNOW_BLOCK, depth: 1, min-altitude: 230 }
    - { block: ASH, depth: 2, min-altitude: 150 }
    - { block: BASALT, depth: 3 }
    - { block: BLACKSTONE, depth: 8 }
    - { block: DEEPSLATE, depth: 999 }

biomes:
  ash_plains:
    biome: basalt_deltas
    priority: 0
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 0.55 }
    surface:
      - { block: BASALT, depth: 3 }
      - { block: BLACKSTONE, depth: 6 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.1 }
    structures: { density: 1.4 }
    decorations: [ash_pile, magma_stone, dead_shrub]

  molten_shore:
    biome: basalt_deltas
    priority: 2
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 1.0 }
    altitude: { max: 58 }
    surface:
      - { block: MAGMA, depth: 2 }
      - { block: BASALT, depth: 4 }
      - { block: BLACKSTONE, depth: 8 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.0 }
    decorations: [magma_stone]

  cinder_peaks:
    biome: stony_peaks
    priority: 3
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 1.0 }
    altitude: { min: 165 }
    surface:
      - { block: OBSIDIAN, depth: 2 }
      - { block: BLACKSTONE, depth: 6 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.0 }
    structures: { density: 2.0 }
    decorations: [obsidian_shard]

  scorched_badlands:
    biome: badlands
    priority: 1
    temperature: { min: 0.5, max: 1.0 }
    humidity: { min: 0.0, max: 0.3 }
    surface:
      - { block: RED_SAND, depth: 2 }
      - { block: TERRACOTTA, depth: 5 }
      - { block: BLACKSTONE, depth: 6 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.05 }
    decorations: [dead_shrub, ash_pile]

caves:
  enabled: true
  tunnels:
    enabled: true
    density: 0.7
    scale: 85
    size: 1.3
    min-y: 8
    max-y: 96
  caverns:
    enabled: true
    density: 0.16
    scale: 200
    size: 2.2
    min-y: 6
    max-y: 80
  # Lava chambers: caverns whose floor is a molten pool. This is the single most
  # volcanic thing in the profile.
  lava-chambers:
    enabled: true
    density: 0.09
    scale: 220
    size: 2.6
    min-y: 5
    max-y: 48
    liquid: LAVA
    liquid-level: 3
  underground-lakes: false

structures:
  enabled: true
  density: 1.0
  max-per-chunk: 2
  min-distance: 130

  types:
    volcanic_vent:
      type: volcanic-vent
      rarity: 0.03
      cell-size: 160
      biomes: [ash_plains, scorched_badlands, molten_shore]
      max-slope: 6
      palette:
        primary: BASALT
        accent: MAGMA_BLOCK
      params: { radius: 9, height: 7 }

    obsidian_spire:
      type: monument
      rarity: 0.01
      cell-size: 280
      biomes: [cinder_peaks, ash_plains]
      max-slope: 6
      palette:
        primary: OBSIDIAN
        accent: MAGMA_BLOCK
      params: { shape: spire, height: 18 }

    ruined_vent_camp:
      type: campsite
      rarity: 0.008
      cell-size: 260
      biomes: [ash_plains]
      max-slope: 3
      params: { tents: 2, campfire: true }

  landmarks:
    the_caldera:
      type: volcanic-vent
      rarity: 0.0006
      cell-size: 1800
      min-distance: 1200
      biomes: [cinder_peaks, ash_plains]
      announce: true
      scale: 3.0
      palette:
        primary: BLACKSTONE
        accent: LAVA
      params: { radius: 26, height: 16 }

    obsidian_monolith:
      type: monument
      rarity: 0.0012
      cell-size: 1200
      min-distance: 800
      biomes: [ash_plains, scorched_badlands]
      announce: true
      scale: 1.6
      palette:
        primary: OBSIDIAN
        accent: CRYING_OBSIDIAN
      params: { shape: obelisk, height: 34 }

decorations:
  enabled: true
  density: 1.0
  types:
    ash_pile:
      type: lichen
      density: 8
      on: [basalt, blackstone, gray_concrete, magma_block]
      params: { block: GRAY_CONCRETE, radius: 3 }

    magma_stone:
      type: rock
      density: 5
      on: [basalt, blackstone, magma_block]
      params: { block: MAGMA_BLOCK, radius: 2 }

    obsidian_shard:
      type: crystal
      density: 1.2
      biomes: [cinder_peaks]
      on: [obsidian, blackstone]
      params: { block: OBSIDIAN, tip: CRYING_OBSIDIAN, height: 5, count: 3 }

    dead_shrub:
      type: dead-tree
      density: 1.5
      biomes: [ash_plains, scorched_badlands]
      on: [basalt, blackstone, red_sand, terracotta]
      params: { block: DEAD_BUSH, height: 2 }

atmosphere:
  sky-color: "#FF5A1E"
  fog-color: "#5A1400"
  haze-density: 14
  particles:
    - { type: ash, density: 12, radius: 6 }
    - { type: embers, density: 8, radius: 4, min-height: 0.3, max-height: 2.0 }
  weather: clear
  precipitation: false
  effects:
    fire_resistance: 0
  music:
    tracks:
      - "MUSIC_NETHER_BASALT_DELTAS:180"
      - "MUSIC_NETHER_WASTES:200"

features:
  lava_chambers: true
  volcanic_vents: true

gameplay:
  environmental-hazards: true
