# ══════════════════════════════════════════════════════════════════════════════
#  CAVERN — an underground-first world: a shell of rock with a walkable
#  cavern kingdom inside it.
#
#  The CAVERN_WORLD style builds a solid shell, then carves wide tunnels and
#  enormous chambers through the middle. Surface biomes still apply to the
#  shell's top, so the world reads as a planet from outside and as a hollow
#  kingdom from within.
# ══════════════════════════════════════════════════════════════════════════════

id: cavern
display-name: "Cavern"
description: "A hollow world of crystal rivers, mushroom groves and deep dark."
icon: GLOWSTONE
style: cavern_world
seed: random

palette:
  stone: STONE
  dirt: DEEPSLATE
  grass: GLOWSTONE
  sand: SAND
  gravel: GRAVEL
  ice: PACKED_ICE
  lava: LAVA
  deepslate: DEEPSLATE
  crystal: AMETHYST_BLOCK
  fungus: MUSHROOM_STEM

terrain:
  height:
    base: 64
    min: 0
    max: 220
  sea-level: 0
  liquid: water

  horizontal-scale: 1.0
  vertical-scale: 1.0

  layers:
    continentalness:
      type: perlin
      scale: 420
      amplitude: 10
      octaves: 3

  mountains:
    enabled: false
  valleys:
    enabled: false
  canyons:
    enabled: false
  cliffs:
    enabled: false
  plateaus:
    enabled: false

  detail-strength: 2
  detail-frequency: 0.02
  distortion-strength: 8
  distortion-frequency: 0.002

  islands:
    enabled: false

surface:
  layers:
    - { block: STONE, depth: 6 }
    - { block: DEEPSLATE, depth: 999 }

biomes:
  crystal_hall:
    biome: dripstone_caves
    priority: 0
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 1.0 }
    surface:
      - { block: DEEPSLATE, depth: 4 }
      - { block: STONE, depth: 24 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.5 }
    decorations: [crystal_spike, glow_patch, cave_mushroom]

  fungal_depths:
    biome: lush_caves
    priority: 1
    temperature: { min: 0.3, max: 1.0 }
    humidity: { min: 0.5, max: 1.0 }
    surface:
      - { block: MOSS_BLOCK, depth: 2 }
      - { block: STONE, depth: 24 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 1.2 }
    decorations: [cave_mushroom, glow_patch, cave_vine]

  deep_dark_basin:
    biome: deep_dark
    priority: 2
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 1.0 }
    altitude: { max: 24 }
    surface:
      - { block: DEEPSLATE, depth: 6 }
      - { block: STONE, depth: 24 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.1 }
    decorations: [crystal_spike]

  under_shell:
    biome: stony_shore
    priority: 3
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 1.0 }
    altitude: { min: 150 }
    vegetation: { density: 0.2 }
    decorations: [glow_patch]

caves:
  enabled: true
  tunnels:
    enabled: true
    density: 0.6
    scale: 90
    size: 1.3
    min-y: 6
    max-y: 120
  caverns:
    enabled: true
    density: 0.18
    scale: 190
    size: 2.2
    min-y: 8
    max-y: 100
  underground-lakes: true

structures:
  enabled: true
  density: 1.2
  max-per-chunk: 2
  min-distance: 120

  types:
    glow_shrine:
      type: monument
      rarity: 0.01
      cell-size: 260
      biomes: [crystal_hall, fungal_depths]
      params: { height: 10, shape: spire }

    crystal_stand:
      type: crystal
      rarity: 0.02
      cell-size: 150
      biomes: [crystal_hall, deep_dark_basin]
      params: { height: 6, count: 5 }

    deep_camp:
      type: campsite
      rarity: 0.008
      cell-size: 260
      biomes: [fungal_depths, crystal_hall]
      params: { tents: 2, campfire: true }

  landmarks:
    underground_temple:
      type: temple
      rarity: 0.0015
      cell-size: 1000
      min-distance: 720
      biomes: [crystal_hall, fungal_depths]
      announce: true
      palette:
        primary: DEEPSLATE_BRICKS
        secondary: POLISHED_DEEPSLATE
        accent: AMETHYST_BLOCK
      params: { size: 15, steps: 5 }

    fossil_bed:
      type: fossil
      rarity: 0.002
      cell-size: 850
      min-distance: 550
      biomes: [deep_dark_basin, under_shell]
      scale: 1.5
      params: { length: 22, height: 6, buried: false }

decorations:
  enabled: true
  density: 1.2
  types:
    crystal_spike:
      type: crystal
      density: 3
      on: [deepslate, stone, tuff]
      params: { block: AMETHYST_BLOCK, tip: BLUE_STAINED_GLASS, height: 5, count: 4 }

    glow_patch:
      type: lichen
      density: 6
      on: [stone, deepslate, moss_block]
      params: { block: GLOWSTONE, radius: 2 }

    cave_mushroom:
      type: mushroom
      density: 8
      on: [stone, deepslate, moss_block]
      params: { blocks: RED_MUSHROOM,BROWN_MUSHROOM }

    cave_vine:
      type: vine
      density: 4
      on: [stone, deepslate, moss_block]
      min-y: 40
      params: { block: CAVE_VINES, length: 6 }

atmosphere:
  sky-color: "#3A3A55"
  fog-color: "#2A2A40"
  haze-density: 10
  particles:
    - { type: dust, density: 6, radius: 5, color: "#8A7AC8" }
    - { type: end_rod, density: 4, radius: 4 }
  weather: clear
  effects:
    darkness: 1
  music:
    tracks:
      - "MUSIC_NETHER_BASALT_DELTAS:240"
      - "MUSIC_END:260"

features:
  cave_flora: true
  glow_lighting: true
  backrooms_entities: false

gameplay:
  custom-mob-spawning: false
  environmental-hazards: false
