# ══════════════════════════════════════════════════════════════════════════════
#  TOXIC — a corrosive swamp-world: acid pools, sulfur flats, dead forests.
#
#  Low, soggy terrain around poisonous lakes, with an atmosphere that bites.
#  The identity section writes itself into config.yml, so the existing
#  atmosphere damage system enforces the hazard without any new code.
# ══════════════════════════════════════════════════════════════════════════════

id: toxic
display-name: "Toxic"
description: "Sulfur flats, acid bogs and forests that died badly."
icon: SPIDER_EYE
style: natural
seed: random

palette:
  stone: STONE
  dirt: SLIME_BLOCK
  grass: MOSS_BLOCK
  sand: RED_SAND
  gravel: GRAVEL
  ice: PACKED_ICE
  lava: LAVA
  deepslate: DEEPSLATE
  sulfur: YELLOW_TERRACOTTA
  acid: LIME_CONCRETE

terrain:
  height:
    base: 64
    min: 20
    max: 170
  sea-level: 62
  liquid: water

  horizontal-scale: 1.2
  vertical-scale: 0.75

  layers:
    continentalness:
      type: perlin
      scale: 680
      amplitude: 20
      octaves: 3
    erosion:
      type: perlin
      scale: 260
      amplitude: 14
      octaves: 4
    weirdness:
      type: perlin
      scale: 180
      amplitude: 10
      octaves: 3

  mountains:
    enabled: true
    strength: 34
    scale: 420
    width: 300
    sharpness: 0.45
  valleys:
    enabled: true
    strength: 16
    scale: 300
    width: 240
    sharpness: 0.25
  canyons:
    enabled: true
    strength: 22
    scale: 250
    width: 0.4
    sharpness: 0.6
  cliffs:
    enabled: false
  plateaus:
    enabled: true
    strength: 14
    scale: 460
    width: 60
    sharpness: 0.3

  detail-strength: 3
  detail-frequency: 0.025
  distortion-strength: 12
  distortion-frequency: 0.002

  islands:
    enabled: false

surface:
  layers:
    - { block: MOSS_BLOCK, depth: 2 }
    - { block: MUD, depth: 4 }
    - { block: STONE, depth: 22 }
    - { block: DEEPSLATE, depth: 999 }

biomes:
  acid_bog:
    biome: swamp
    priority: 0
    temperature: { min: 0.5, max: 1.0 }
    humidity: { min: 0.6, max: 1.0 }
    altitude: { max: 66 }
    surface:
      - { block: MUD, depth: 3 }
      - { block: CLAY, depth: 3 }
      - { block: STONE, depth: 20 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.9 }
    structures: { density: 1.1 }
    decorations: [dead_tree, toxic_grass, sulfur_vent]

  sulfur_flat:
    biome: savanna
    priority: 1
    temperature: { min: 0.7, max: 1.0 }
    humidity: { min: 0.0, max: 0.4 }
    surface:
      - { block: YELLOW_TERRACOTTA, depth: 3 }
      - { block: RED_SAND, depth: 3 }
      - { block: STONE, depth: 20 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.1 }
    structures: { density: 1.3 }
    decorations: [sulfur_vent, boulder]

  dead_forest:
    biome: dark_forest
    priority: 2
    temperature: { min: 0.3, max: 0.9 }
    humidity: { min: 0.4, max: 0.9 }
    surface:
      - { block: COARSE_DIRT, depth: 2 }
      - { block: MUD, depth: 4 }
      - { block: STONE, depth: 22 }
      - { block: DEEPSLATE, depth: 999 }
    vegetation: { density: 0.6 }
    decorations: [dead_tree, toxic_grass]

  poison_sprawl:
    biome: swamp
    priority: 3
    temperature: { min: 0.0, max: 1.0 }
    humidity: { min: 0.0, max: 1.0 }
    altitude: { min: 66 }
    vegetation: { density: 0.4 }
    decorations: [toxic_grass, boulder, sulfur_vent]

caves:
  enabled: true
  tunnels:
    enabled: true
    density: 0.55
    scale: 95
    size: 1.1
    min-y: 10
    max-y: 68
  caverns:
    enabled: true
    density: 0.12
    scale: 200
    size: 1.9
    min-y: 8
    max-y: 56
  underground-lakes: true
  overrides:
    sulfur_flat:
      tunnels: { density: 0.7 }

structures:
  enabled: true
  density: 1.0
  max-per-chunk: 2
  min-distance: 130

  types:
    vent_cluster:
      type: volcanic-vent
      rarity: 0.015
      cell-size: 200
      biomes: [sulfur_flat, acid_bog]
      max-slope: 5
      params: { radius: 5, height: 4 }

    dead_camp:
      type: campsite
      rarity: 0.008
      cell-size: 250
      biomes: [dead_forest, poison_sprawl]
      max-slope: 3
      params: { tents: 2, campfire: false }

  landmarks:
    toxic_dump:
      type: ruin
      rarity: 0.002
      cell-size: 850
      min-distance: 600
      biomes: [sulfur_flat, dead_forest]
      announce: true
      palette:
        primary: TINTED_GLASS
        secondary: IRON_BLOCK
        accent: LIME_CONCRETE
      params: { width: 13, height: 8, pillars: 5 }

    graveyard:
      type: bones
      rarity: 0.0025
      cell-size: 750
      min-distance: 500
      biomes: [dead_forest, poison_sprawl]
      scale: 1.7
      params: { radius: 15 }

decorations:
  enabled: true
  density: 1.0
  types:
    dead_tree:
      type: dead-tree
      density: 3
      biomes: [dead_forest, acid_bog]
      on: [mud, coarse_dirt, moss_block]
      max-slope: 3
      params: { block: DARK_OAK_LOG, height: 8 }

    toxic_grass:
      type: grass
      density: 18
      on: [moss_block, mud, coarse_dirt]
      params: { block: LARGE_FERN }

    sulfur_vent:
      type: rock
      density: 2
      on: [yellow_terracotta, red_sand, mud, stone]
      params: { block: YELLOW_CONCRETE, radius: 2 }

    boulder:
      type: rock
      density: 2.5
      on: [moss_block, mud, stone, yellow_terracotta]
      params: { block: MOSSY_COBBLESTONE, radius: 3 }

atmosphere:
  sky-color: "#B8C86A"
  fog-color: "#96A84E"
  water-color: "#7FA83C"
  haze-density: 9
  particles:
    - { type: dust, density: 8, radius: 5, color: "#C8E070" }
    - { type: falling_spores, density: 5, radius: 4 }
  weather: rain
  # The air itself hurts: helmets filter it, the existing atmospheres system
  # applies the damage while a player is on this planet.
  damage: 1
  helmets: [TURTLE_HELMET, IRON_HELMET, DIAMOND_HELMET]
  effects: {}
  music:
    tracks:
      - "MUSIC_NETHER_SOUL_SAND_VALLEY:230"
      - "MUSIC_OVERWORLD_SWAMP:240"

features:
  toxic_flora: true
  environmental_hazards: true
  dinosaurs: false

gameplay:
  custom-mob-spawning: false
  environmental-hazards: true
